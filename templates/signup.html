<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MySync — Sign up</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-page">
  <main class="auth-card">
    <div class="brand-mark">M</div>
    <h1>Create your account</h1>
    <p class="muted">One account, one shareable MySync ID, all your clipboards.</p>

    {% if error %}<div class="alert error">{{ error }}</div>{% endif %}

    <form method="post" class="stack-lg">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>
        Name to show others
        <input type="text" name="display_name" autocomplete="name" required maxlength="60" autofocus>
      </label>
      <label>
        Gmail / email
        <input type="email" name="email" autocomplete="email" required maxlength="320">
      </label>
      <label>
        MySync password
        <input type="password" name="password" autocomplete="new-password" required minlength="8" maxlength="128">
      </label>
      <button class="primary-btn" type="submit">Create account</button>
    </form>

    <p class="switch-auth">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
    <p class="tiny muted">Your MySync password is not your Google/Gmail password.</p>
  </main>
</body>
</html>
