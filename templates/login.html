<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MySync — Log in</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-page">
  <main class="auth-card">
    <div class="brand-mark">M</div>
    <h1>Welcome back</h1>
    <p class="muted">Log in to access your synced clipboard.</p>

    {% if error %}<div class="alert error">{{ error }}</div>{% endif %}

    <form method="post" class="stack-lg">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>
        Gmail / email
        <input type="email" name="email" autocomplete="email" required maxlength="320" autofocus>
      </label>
      <label>
        MySync password
        <input type="password" name="password" autocomplete="current-password" required maxlength="128">
      </label>
      <button class="primary-btn" type="submit">Log in</button>
    </form>

    <p class="switch-auth">New to MySync? <a href="{{ url_for('signup') }}">Create an account</a></p>
    <p class="tiny muted">Your MySync password is separate from your Google/Gmail password.</p>
  </main>
</body>
</html>
