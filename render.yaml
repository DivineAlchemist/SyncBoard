services:
  - type: web
    name: mysync
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 100 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: mysync-db
          property: connectionString
      - key: SESSION_COOKIE_SECURE
        value: "true"

databases:
  - name: mysync-db
    plan: free
    diskSizeGB: 1
